# Fork-owned workflow (qvictl/koreader): not part of upstream KOReader.
#
# CI for `main` and pull requests to it:
#   - Lint                 : upstream's lint (shellcheck, luacheck, unscaled sizes, gettext…)
#   - Build and unit tests : emulator build + affected front unit suites (full fallback; luacov),
#                            Kindle HF & PW2 builds (upstream build machinery)
#   - Coverage             : changed-line unit coverage >= 80%; partial whole metrics are unmeasured.
# Emulator integration and combined coverage run only in Fork release.
# The "Tests policy" check lives in tests_policy.yml (it must re-run when labels change).
#
# The jobs named exactly "Lint", "Build and unit tests" and
# "Coverage" are the ones required by the branch protection of `main`.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number (when dispatched on a PR branch, e.g. by the upstream sync)'
        required: false
        type: string

concurrency:
  # Pushes to main: one group per commit (never cancelled), so each commit
  # tests its own change range. Whole coverage is measured at release.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:

  # Work. {{{

  upstream-lint:
    name: Upstream lint
    uses: ./.github/workflows/lint.yml

  emulator:
    name: Emulator
    uses: ./.github/workflows/fork_emulator.yml
    with:
      unit_test_base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
      unit_test_event: ${{ github.event_name }}

  kindle:
    name: Kindle
    uses: ./.github/workflows/build.yml
    with:
      jobs: 'kindlehf kindlepw2'

  coverage-report:
    name: Coverage report
    needs: emulator
    if: ${{ !cancelled() && needs.emulator.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    outputs:
      ok: ${{ steps.coverage.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          clean: false
          fetch-depth: 0
          filter: tree:0
          show-progress: false
      - name: Checkout base
        run: git submodule update --init --depth 1 base
      - name: Download emulator & coverage
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: '{koreader-emulator-x86_64,unit-coverage}'
          path: artifacts
      - name: Release check unit tests
        run: python3 .ci/fork/release_check_test.py
      - name: Coverage gates
        id: coverage
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_MODE: diff
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: ./.ci/fork/coverage.sh artifacts
      - name: Upload result
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-result
          path: coverage-result.json
          retention-days: 30

  # }}}

  # Required checks (gates). {{{

  lint:
    name: Lint
    needs: upstream-lint
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - run: '[[ "${{ needs.upstream-lint.result }}" == success ]]'

  build:
    name: Build and unit tests
    needs: [emulator, kindle]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo "emulator: ${{ needs.emulator.result }}, kindle: ${{ needs.kindle.result }}"
          [[ "${{ needs.emulator.result }}" == success ]] && [[ "${{ needs.kindle.result }}" == success ]]

  coverage:
    name: Coverage
    needs: coverage-report
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo "report: ${{ needs.coverage-report.result }}, ok: ${{ needs.coverage-report.outputs.ok }}"
          [[ "${{ needs.coverage-report.result }}" == success ]] && [[ "${{ needs.coverage-report.outputs.ok }}" == true ]]

  # }}}

