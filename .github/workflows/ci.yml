# Fork-owned workflow (qvictl/koreader): not part of upstream KOReader.
#
# CI for `main` and pull requests to it:
#   - Lint                 : upstream's lint (shellcheck, luacheck, unscaled sizes, gettext…)
#   - Build and unit tests : emulator build + base & front unit tests (busted, front with luacov),
#                            Kindle HF & PW2 builds (upstream build machinery)
#   - Integration tests    : emulator integration scenarios (spec/integration), with budgets,
#                            then again with luacov
#   - Coverage             : coverage gates (see CONTRIBUTING.md, .ci/coverage_config.lua):
#                            diff coverage (unit >= 80%, unit + integration >= 90%), overall
#                            coverage ratchet vs main, fork-owned modules' dated targets
# The "Tests policy" check lives in tests_policy.yml (it must re-run when labels change).
#
# The jobs named exactly "Lint", "Build and unit tests", "Integration tests" and
# "Coverage" are the ones required by the branch protection of `main`.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number (when dispatched on a PR branch, e.g. by the upstream sync)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:

  # Work. {{{

  upstream-lint:
    name: Upstream lint
    uses: ./.github/workflows/lint.yml

  emulator:
    name: Emulator
    uses: ./.github/workflows/fork_emulator.yml

  kindle:
    name: Kindle
    uses: ./.github/workflows/build.yml
    with:
      jobs: 'kindlehf kindlepw2'

  integration:
    name: Emulator integration tests
    needs: emulator
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # Same image as the build (the emulator uses the system's SDL3).
    container:
      image: koreader/kobase:5.0.0-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          clean: false
          fetch-depth: 1
          show-progress: false
      - name: Download emulator
        uses: actions/download-artifact@v8.0.2
        with:
          name: koreader-emulator-x86_64
      - name: Extract emulator
        run: |
          mkdir -p emu
          tar -C emu -xJf koreader-emulator-x86_64.tar.xz
          cat emu/koreader/git-rev
      - name: Integration tests
        id: tests
        run: ./tools/run_integration_tests.sh --kodir emu/koreader --output it-results
      - name: Integration tests (coverage)
        id: coverage
        if: ${{ !cancelled() }}
        run: ./tools/run_integration_tests.sh --coverage --kodir emu/koreader --output it-coverage
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          cat it-results/summary.md >>"${GITHUB_STEP_SUMMARY}" || true
          if [[ -r it-coverage/summary.md ]]; then
            echo '<details><summary>Coverage run</summary>' >>"${GITHUB_STEP_SUMMARY}"
            echo >>"${GITHUB_STEP_SUMMARY}"
            cat it-coverage/summary.md >>"${GITHUB_STEP_SUMMARY}"
            echo '</details>' >>"${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-results
          path: |
            it-results/summary.md
            it-results/junit.xml
            it-results/timings.json
            it-results/results/
            it-results/logs/
            it-coverage/summary.md
            it-coverage/logs/
          retention-days: 14
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-coverage
          path: it-coverage/integration.stats.out
          if-no-files-found: ignore
          retention-days: 14

  coverage-report:
    name: Coverage report
    needs: [emulator, integration]
    if: ${{ !cancelled() && needs.emulator.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    outputs:
      ok: ${{ steps.coverage.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          clean: false
          fetch-depth: 0
          filter: tree:0
          show-progress: false
      - name: Checkout base
        run: git submodule update --init --depth 1 base
      - name: Download emulator & coverage
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: '{koreader-emulator-x86_64,unit-coverage,integration-coverage}'
          path: artifacts
      - name: Coverage gates
        id: coverage
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: ./.ci/fork/coverage.sh artifacts
      - name: Upload result
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-result
          path: coverage-result.json
          retention-days: 30

  coverage-publish:
    # main's coverage: baseline for the PR ratchet, history, badges (`coverage` branch).
    name: Coverage history
    needs: coverage-report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.coverage-report.result == 'success'
    runs-on: ubuntu-26.04
    concurrency:
      group: coverage-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          clean: false
          fetch-depth: 1
          show-progress: false
          sparse-checkout: .ci
      - name: Download result
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-result
      - name: Publish
        run: ./.ci/fork/coverage_publish.sh coverage-result.json

  # }}}

  # Required checks (gates). {{{

  lint:
    name: Lint
    needs: upstream-lint
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - run: '[[ "${{ needs.upstream-lint.result }}" == success ]]'

  build:
    name: Build and unit tests
    needs: [emulator, kindle]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo "emulator: ${{ needs.emulator.result }}, kindle: ${{ needs.kindle.result }}"
          [[ "${{ needs.emulator.result }}" == success ]] && [[ "${{ needs.kindle.result }}" == success ]]

  integration-gate:
    name: Integration tests
    needs: integration
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - run: '[[ "${{ needs.integration.result }}" == success ]]'

  coverage:
    name: Coverage
    needs: coverage-report
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo "report: ${{ needs.coverage-report.result }}, ok: ${{ needs.coverage-report.outputs.ok }}"
          [[ "${{ needs.coverage-report.result }}" == success ]] && [[ "${{ needs.coverage-report.outputs.ok }}" == true ]]

  # }}}

# vim: foldmethod=marker foldlevel=0
